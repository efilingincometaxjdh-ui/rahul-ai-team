name: Agent 02 - XAUUSD Market Intelligence

on:
  workflow_dispatch:
  schedule:
    # Phase 2 observation cadence: every 15 minutes on weekdays.
    - cron: "*/15 * * * 1-5"

permissions:
  contents: read

jobs:
  run-agent02:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Agent 02
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENVIRONMENT: ${{ vars.CTRADER_ENVIRONMENT || 'demo' }}
          CTRADER_SYMBOL: ${{ vars.CTRADER_SYMBOL || 'XAUUSD' }}
        run: python agent02.py

      - name: Upload current market state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent02-state
          path: data/current/agent02.json
          if-no-files-found: warn
          retention-days: 7
